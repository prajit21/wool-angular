<div
  class="currency-widget height-equal widget-currency"
  [ngClass]="$safeNavigationMigration(currency()?.colorClass)"
>
  <div class="d-flex">
    <div class="currency-icon-widget">
      <app-svg-icon [icon]="$safeNavigationMigration(currency()?.icon)" />
    </div>
    <div>
      <h4>{{ currency()?.coinName }} <span class="f-light">{{ currency()?.tag }}</span></h4>
    </div>
  </div>
  <div class="card">
    <div class="card-body d-flex">
      <div class="currency-chart-wrap">
        <div id="currency-chart">
          <apx-chart
            [series]="$safeNavigationMigration(currency()?.series)!"
            [chart]="$safeNavigationMigration(currency()?.chart)!"
            [grid]="$safeNavigationMigration(currency()?.grid)!"
            [colors]="$safeNavigationMigration(currency()?.colors)!"
            [stroke]="$safeNavigationMigration(currency()?.stroke)!"
            [labels]="$safeNavigationMigration(currency()?.labels)!"
            [markers]="$safeNavigationMigration(currency()?.markers)!"
            [xaxis]="$safeNavigationMigration(currency()?.xaxis)!"
            [yaxis]="$safeNavigationMigration(currency()?.yaxis)!"
            [legend]="$safeNavigationMigration(currency()?.legend)!"
            [tooltip]="$safeNavigationMigration(currency()?.tooltip)!"
            [responsive]="$safeNavigationMigration(currency()?.responsive)!"
          />
        </div>
      </div>
      <div class="bg-light-{{ currency()?.colorClass }} text-center">
        <h4 class="mb-sm-0">${{ currency()?.price }}</h4>
        <span class="f-12 f-w-500 font-{{ currency()?.colorClass }}">
          <app-feather-icons [icon]="'trending-up'" />
          {{ currency()?.parsonage }}%</span
        >
      </div>
    </div>
  </div>
</div>
